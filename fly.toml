# Fly.io config for the Chargeback Tracker.
# `app` must be globally unique — `fly launch` will set/replace it, or edit here.
app = "chargeback-tracker"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  SESSION_COOKIE_SECURE = "true"
  # ALLOW_SIGNUP is intentionally unset -> public signup is closed. The first
  # account (created through the UI on a fresh volume) bootstraps the admin.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep at least 1 machine: a Fly volume attaches to a single machine, and
  # SQLite must not be split across instances. Do not `scale count` above 1.
  min_machines_running = 1

# Persistent storage for the SQLite db and uploaded attachments.
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
