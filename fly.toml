# fly.toml app configuration file generated for chargeback-tracker on 2026-07-19T21:55:01+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chargeback-tracker'
primary_region = 'iad'

[build]
[env]
  DATA_DIR = '/data'
  SESSION_COOKIE_SECURE = 'true'
  # ALLOW_SIGNUP is intentionally unset -> public signup is closed. The admin
  # is seeded at startup from the ADMIN_USERNAME / ADMIN_PASSWORD_HASH secrets.

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep at 1: the Fly volume attaches to a single machine and SQLite must not
  # be split across instances. Do not `fly scale count` above 1.
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
